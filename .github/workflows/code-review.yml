name: LLM Code Review

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      # ⚠️ 关键：checkout base 分支，而不是 PR 分支
      - name: Checkout base branch (safe)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # 🔍 Debug（现在一定能看到 key）
      - name: Debug OPENAI_API_KEY presence
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "==== DEBUG OPENAI_API_KEY ===="
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "❌ OPENAI_API_KEY is EMPTY"
            exit 1
          else
            echo "✅ OPENAI_API_KEY is PRESENT"
            echo "Key length: ${#OPENAI_API_KEY}"
          fi

      # 🤖 真正运行 LLM Code Reviewer
      - name: Run LLM Code Reviewer
        uses: tusgino/llm-code-reviewer@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
